apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-metering
  labels:
    app: usage-metering
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: usage-metering
  template:
    metadata:
      labels:
        app: usage-metering
    spec:
      containers:
        - name: usage-metering
          image: ghcr.io/saksham-mist/usage-metering-api:IMAGE_TAG
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: usage-metering-config
            - secretRef:
                name: usage-metering-secret
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
